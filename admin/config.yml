### Tiny Planet — Website CMS config (Sveltia CMS)
###
### This lets you edit every piece of website copy, in every language, from a
### simple web form at yourdomain.com/admin — no code editing needed.
###
### AUTH: Netlify's old "Git Gateway" is no longer supported by Sveltia CMS,
### so this connects straight to GitHub instead. The first time you open
### /admin, click "Sign In with Token" — it walks you through generating a
### GitHub personal access token scoped to just this repo (Contents:
### read/write). Paste it in and you're logged in. No Netlify Identity setup
### needed at all.

backend:
  name: github
  repo: didacpedrola/tinyplanet-website
  branch: main

# Where uploaded images (if you ever add any through the CMS) get stored.
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Show a "these changes are live once saved" style workflow instead of
# drafts/PRs — simplest option for a one-person team.
publish_mode: simple

locale: en

collections:
  - name: "translations"
    label: "Website Text (all languages)"
    files:
      - name: "en"
        label: "🇬🇧 English"
        file: "i18n/en.json"
        fields: &translation_fields
