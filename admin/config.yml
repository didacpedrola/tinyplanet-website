          - { label: "Hero button 1", name: "hero_cta1", widget: "string" }
          - { label: "Hero button 2", name: "hero_cta2", widget: "string" }
          - { label: "\"From\" (price prefix)", name: "from_price", widget: "string" }
          - { label: "Duration option: 1–2 weeks", name: "week_1_2", widget: "string" }
          - { label: "Duration option: 3–4+ weeks", name: "week_3_4", widget: "string" }
          - { label: "Duration field label", name: "duration_label", widget: "string" }
          - { label: "Trust stat label: Countries", name: "trust_countries", widget: "string" }
          - { label: "Trust stat label: Languages", name: "trust_langs", widget: "string" }
          - { label: "Trust stat label: Ships worldwide", name: "trust_ships", widget: "string" }

          # — Problem band —
